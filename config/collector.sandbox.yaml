receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
  redaction/bqp:
    # Defense in depth for raw producers: match normalized variants, not only exact keys.
    allow_all_keys: true
    redact_all_types: true
    blocked_key_patterns:
      - (?i).*token.*
      - (?i).*secret.*
      - (?i).*password.*
      - (?i).*authorization.*
      - (?i).*oauth.*
      - (?i).*private[_\.-]?key.*
      - (?i).*terminal.*
      - (?i).*stdout.*
      - (?i).*stderr.*
    summary: silent
exporters:
  debug:
    verbosity: basic
  file:
    path: /var/lib/bqp-otel/events.jsonl
    rotation:
      max_megabytes: 10
      max_backups: 5
      max_days: 7
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      level: normal
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/bqp, batch]
      exporters: [debug, file]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/bqp, batch]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction/bqp, batch]
      exporters: [debug, file]
