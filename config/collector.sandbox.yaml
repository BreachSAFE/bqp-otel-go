receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
  attributes/redact_sensitive:
    actions:
      - key: token
        action: delete
      - key: secret
        action: delete
      - key: password
        action: delete
      - key: authorization
        action: delete
      - key: oauth
        action: delete
      - key: private_key
        action: delete
      - key: terminal
        action: delete
      - key: stdout
        action: delete
      - key: stderr
        action: delete
exporters:
  debug:
    verbosity: basic
  file:
    path: /var/lib/bqp-otel/events.jsonl
extensions:
  zpages:
service:
  extensions: [zpages]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_sensitive, batch]
      exporters: [debug, file]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_sensitive, batch]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_sensitive, batch]
      exporters: [debug, file]
