name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OCB_VERSION: v0.159.0

jobs:
  config:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/paul007ex/breachsafe-golden-go@sha256:542520836ac7f681826af610acb9fb5230e1e1b9e97ae2f2d2b744099d32f605
      options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Golden toolchain smoke test
        run: |
          go version
          test "${CGO_ENABLED}" = 1
          gcc --version
          govulncheck -version
          staticcheck -version
          gosec -version
          golangci-lint version
      - name: Format check
        run: test -z "$(gofmt -l sdk)"
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Module verification
        run: go mod verify
      - name: Staticcheck
        run: staticcheck ./...
      - name: Gosec
        run: gosec -exclude-generated ./...
      - name: Govulncheck
        run: govulncheck ./...
      - name: OSV scan
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
          osv-scanner scan source -r .
      - name: Build pinned collector distribution
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@${OCB_VERSION}
          export GOFLAGS="${GOFLAGS} -buildvcs=false"
          builder --config otelcol-builder.yaml
          test -x dist/bqp-otel
      - name: Verify generated binary
        run: dist/bqp-otel components | head -80
      - name: Real SDK to Collector integration
        run: |
          mkdir -p /var/lib/bqp-otel
          dist/bqp-otel --config config/collector.sandbox.yaml >/tmp/bqp-otel.log 2>&1 &
          collector_pid=$!
          trap 'kill "${collector_pid}" 2>/dev/null || true' EXIT
          sleep 2
          go test -count=1 ./integration
          sleep 2
          test -s /var/lib/bqp-otel/events.jsonl
          grep -q 'integration.probe' /var/lib/bqp-otel/events.jsonl
